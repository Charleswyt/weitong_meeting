    # ————————————————————————————————————————————————————————
    # WebSocket `/ws/v1/meeting` 帧形状。
    # OpenAPI 3.1 没有 channel 概念，所以这些**不挂在 paths 下**，只作为具名 schema 存在 ——
    # 但它们同样是真源：前端 WS 侧类型也从这里生成，不再手写。
    # 握手：`GET /ws/v1/meeting?meetingId=&ticket=`，两个参数**都必填**（`hub.go:80-95`）。
    # 票据由 `POST /meetings/ws-ticket` 签，TTL 60 秒、一次性、取出即销毁。
    # **鉴权失败是握手前的 HTTP 拒绝**（400 缺参 / 401 票无效或会议号不符 / 403 未在会中），
    # 不存在"连上之后再关帧"这种形态；该路由绑在 `/api/v1` 组外，**JWT 不参与 WS**。
    # 信封恒两键 `{type, data}`（`hub.go:22-25`，**均无 omitempty** → data 为 nil 时出 `"data":null`）。
    # ————————————————————————————————————————————————————————

    WsParticipantsData:
      type: object
      description: >-
        下行帧 `type: "participants"` 的 data。**WS 多这一层匿名包装对象**，
        REST 里这两个数组只作为 `MeetingStateVo` 的子键出现，从不单独返回。
        元素形状与 REST **同一个 Go 结构、同一个构造器**（`model/meeting_state.go` +
        `service/meeting_state.go:25-133`），所以字段级零分叉 —— 分叉只在包装。
      x-source: backend/internal/websocket/hub.go:357-363
      required: [participants, invited]
      properties:
        participants:
          type: array
          items: { $ref: '#/components/schemas/ParticipantVo' }
          x-source: hub.go:358
        invited:
          type: array
          items: { $ref: '#/components/schemas/InvitedVo' }
          x-source: hub.go:359

    WsMeetingData:
      description: >-
        下行帧 `type: "meeting"` 的 data —— **就是 REST `GET /meetings/{id}/state` 那个 `MeetingStateVo`**，
        同一构造器。〔但零值兜底不同〕`hub.go:272-279` 在撤房补发时只填 `meetingId` 与三个空数组，
        `status`/`startedAt`/`hostId` 等出空值 —— 契约标它们全 required，
        所以**前端不许按"键在不在"判有没有数据，只能按值判**。
      allOf:
        - $ref: '#/components/schemas/MeetingStateVo'
      x-source: backend/internal/websocket/hub.go:272-279,373

    WsStreamsData:
      description: >-
        下行帧 `type: "streams"` 的 data 是**裸数组**（`states.Streams`），不是对象 ——
        REST 从不单独返回流数组，所以这一帧的根形状在 HTTP 侧不存在。
      type: array
      items: { $ref: '#/components/schemas/StreamVo' }
      x-source: backend/internal/websocket/hub.go:376

    WsChatData:
      type: object
      description: >-
        下行帧 `type: "chat"` 的 data。〔与 REST 的**两处**不同，不是只改了名〕
        1. 键名 `senderNodeType`（REST 是 `senderEndpointType`）；
        2. **值域也不同**：这里过 `NodeTypeOf` 归一成 `edge|cloud`，
           而 REST 是三方原值透传（`ship`/`shore`/…）。
        所以两个通道的这个字段**不能共用一个类型** —— 前端 `useWebSocket.ts:16` 用 `senderNodeType` 是对的。
      x-source: backend/internal/websocket/hub.go:400-406
      required: [id, text, senderName, senderNodeType, sentAt]
      properties:
        id: { type: integer, format: int64, x-source: hub.go:401 }
        text: { type: string, x-source: hub.go:402 }
        senderName: { type: string, x-source: hub.go:403 }
        senderNodeType: { type: string, enum: [edge, cloud], description: 归一后的本域词；未知值按本实例 deployment.side 兜底（默认 edge）并告警, x-source: hub.go:404 + service/meeting_state.go:210-228 }
        sentAt: { type: string, description: 与 REST 同一个时间格式（Y-m-dTH:i:sP）, x-source: hub.go:405 }

    WsTimeData:
      type: object
      description: >-
        下行帧 `type: "time"` 的 data —— 校时。这两个键名与 `MeetingStateVo` 里的同名，
        但 REST 没有"只回这两个字段"的形状。前端把 `clockDriftMs` 当可选用。
      x-source: backend/internal/websocket/hub.go:378-381
      required: [serverTime]
      properties:
        serverTime: { type: integer, format: int64, description: 毫秒, x-source: hub.go:379 }
        clockDriftMs: { type: integer, x-source: hub.go:380 }

    WsSpeakingDown:
      type: object
      description: >-
        下行帧 `type: "speaking"` 的 data。**单播**：`room.send(ws, …)` 只发给除发送者外的成员
        （`hub.go:430-440`），所以"我自己说了话"这件事不会从这条帧回来。
        `participantId` 由服务端从会话补，**不信任上行里带的值**。
      x-source: backend/internal/websocket/hub.go:500-503
      required: [participantId, speaking]
      properties:
        participantId: { type: string, x-source: hub.go:501 }
        speaking: { type: boolean, x-source: hub.go:502 }

    WsMediaUp:
      type: object
      description: >-
        上行帧 `type: "media"` 的 data。**四个都是可空指针**：
        "这一项没提"与"提了但值是 false"必须分得开 —— 后端 `UpdateMedia` 收的是 `*bool`，
        只把非 nil 的项写进会话。〔历史坑〕这里早先直接反序列化三方 MediaState
        （词形是 `cameraEnabled`/…），前端发的字段一个都对不上，**媒体意图位恒为 false**。
      x-source: backend/internal/websocket/hub.go:465-484
      properties:
        cameraOn: { type: boolean, nullable: true, x-source: hub.go:469 }
        micOn: { type: boolean, nullable: true, x-source: hub.go:470 }
        sharing: { type: boolean, nullable: true, x-source: hub.go:471 }
        recording: { type: boolean, nullable: true, x-source: hub.go:472 }

    WsChatUp:
      type: object
      description: "上行帧 type=chat 的 data。转发失败只告警不断连（`hub.go:491-493`）。"
      x-source: backend/internal/websocket/hub.go:485-494
      required: [text]
      properties:
        text: { type: string, x-source: hub.go:487 }
        clientMessageId: { type: string, description: 幂等键, x-source: hub.go:488 }

    WsSpeakingUp:
      type: object
      description: >-
        上行帧 `type: "speaking"` 的 data —— **只有 `speaking` 一个字段**，
        `participantId` 由服务端从会话补。〔记账〕前端 `useWebSocket.ts:147-151` 声明了会发这一类，
        但全 src **无实际调用点**（本地检测只写 `speakingMap`，不上行）—— 这条上行目前是空转的。
      x-source: backend/internal/websocket/hub.go:495-504
      required: [speaking]
      properties:
        speaking: { type: boolean, x-source: hub.go:497 }

  # 真状态码错误体，供流式/字节端点复用（reason 由状态码一处导出，§1:55-68 / response.go:93-124）
  responses:
    StreamError:
      description: 流式/字节端点失败——真非 2xx + {code,msg,reason}（response.FailStream，response.go:93-101）
      content:
        application/json:
          schema:
            type: object
            required: [code, msg, reason]
            properties:
              code: { type: integer, x-source: response.go:97 }
              msg: { type: string, x-source: response.go:98 }
              reason: { type: string, enum: [forbidden, not_found, gone, warming, upstream_unreachable, no_channel, bad_request, system_error, not_in_meeting], x-source: response.go:99, description: "由状态码一处导出（streamReason，response.go:106-124），调用点不传第二份字符串。〔2026-10-10 收口〕取值域从映射表数出来，与 §1 信封侧那三个是两套：一边由业务分支点名、一边由状态码推导，E2 那条看起来冲突就出在这里" }

security:
