              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginData' }
        '403':
          description: 开关关闭或账号不可用（故意不用 401，§5.1:181-184）。reason=auto_login_disabled|auto_login_user_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

