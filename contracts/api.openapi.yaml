# 派生件：由人工逐字段对照 backend 运行时出口（controller 的 `response.Ok*/OkWithRows` 实返回值 + api/v1 与 internal/model 的实际 VO struct），
# 交叉 contracts/api-contract.md §6 与 frontend/src/api/*.ts，于 2026-10-10 手工编制产出
#
# 〔状态〕G5 已落地（`pnpm run check:types` / `node tools/check.mjs`），DERIVATION §4 的 23 条分叉已逐条裁定，
# 所以**已覆盖的这 42 条路由以本文件为准**；未覆盖的端点不在此文件里，**不等于没有契约** ——
# 缺口只剩 WebSocket `/ws/v1/meeting` 的帧形状（HTTP 侧已全部进来，清单见 DERIVATION §6 末）。
#
# 真源 = backend 运行时形状（不是 api/v1 里那些 *Res 装饰体——它们自称"仅 swagger 装饰、运行时不消费"，
# 且实测与 handler 实返回不一致，逐条记在 DERIVATION.md）。
# 每个字段的出处写在 x-source 里：`文件:行`（Go）或 `§小节`（文档）。指不出来源的字段没有写进来。
# 覆盖范围只到 DERIVATION.md 声明的端点；其余端点不在此文件里（见 DERIVATION.md「尚未派生的端点清单」）。
openapi: 3.1.0
info:
  title: edge/conference HTTP 契约（已覆盖部分为真源）
  version: 0.1.0
  description: >-
    运行时形状取自 backend controller 的实际出口（不是 `api/v1/*Res` 装饰体）；文档口径见 `api-contract.md` §6，
    分叉与裁定逐条记在同目录 `DERIVATION.md`。派生件 `frontend/src/types/api.gen.ts` 由本文件生成并带源哈希。
    覆盖 42 条路由 —— HTTP 侧已全；未覆盖只剩 WebSocket `/ws/v1/meeting` 的帧形状（见 DERIVATION §6 末）。
servers:
  - url: https://47.114.83.151/zwt-meeting/api/v1
    description: 中卫通公网会议
  - url: /api/v1
    description: GoFrame 路由组前缀（backend/internal/cmd/cmd.go:107）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "其余请求 Authorization: Bearer <jwt>（§5.1）"
    queryToken:
      type: apiKey
      in: query
      name: token
      description: >-
        只读资产端点接受 ?token=<jwt>（媒体代理 / 回放资产 / 头像字节，§5.1:185-188）。
        后端不把票拼进任何 VO 字段。

  # ---- 信封（所有非流式响应的最外层；来源 backend/internal/response/response.go）----
  schemas:
    Envelope:
      type: object
      description: 单对象响应信封 response.Ok（response.go:10-21）
      x-source: backend/internal/response/response.go:10-21
      required: [code, msg]
      properties:
        code:
          type: integer
          x-source: response.go:11
        msg:
          type: string
          x-source: response.go:12
        reason:
          type: string
          enum: [not_in_meeting, auto_login_disabled, auto_login_user_unavailable]
          description: >-
            可选机器码（omitempty，**多数错误根本没有这个键**）。取值域不是手写清单而是扫出来的：
            全后端只有 `errs.BizReason(err, R)` 这一处注入点，实参只有这三个常量
            （`not_in_meeting` 与 `auto_login.go:31-32` 那两个）。
            〔2026-10-10 收口〕此前这里写"只定义 not_in_meeting"，是漏了免登录那两个 ——
            它们已经在部署手册的排障表里被当作判据用了。
            **媒体代理端点不在此列**，那侧的 reason 由状态码一处导出，见 `StreamError`。
          x-source: internal/errs/errs.go:25-27 + internal/service/auto_login.go:31-32 + controller/meeting/meeting.go:604
        data:
          description: 载荷（omitempty）；各端点具体形状见对应 *Envelope 的 allOf
          x-source: response.go:14

    ErrorEnvelope:
      type: object
      description: 失败信封 response.Fail / FailSystem / FailValidate（response.go:41-75）
      x-source: backend/internal/response/response.go:41-75
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 业务失败恒为 500；参数校验 400；未登录 401（HTTP 状态仍 200，§1:33）
          x-source: response.go:42,66,74,127
        msg:
          type: string
          x-source: response.go:12
        reason:
          type: string
          enum: [not_in_meeting, auto_login_disabled, auto_login_user_unavailable]
          description: 同 Envelope.reason —— 多数失败根本没有这个键
          x-source: response.go:13

    PageEnvelopeMeetings:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          description: >-
            分页出口 response.OkWithRows 是扁平结构（顶层 rows/total，不走 data，也不 omitempty；
            空集仍出 rows:[]/total:0）。§1:17-23 / response.go:32-39
          x-source: backend/internal/response/response.go:32-39
          required: [rows, total]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MeetingVo' }
              x-source: meeting.go:92 (OkWithRows rows)
            total:
