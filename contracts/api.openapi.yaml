      security: []
      x-source: cmd.go:112 + api/v1/auth.go:6
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginReq' }
      responses:
        '200':
          description: >-
            成功 data={token,user,linkSynced,linkReason?}；口令/账号不符等业务失败走 HTTP 200 + {code:500}。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginData' }
        '409':
          description: 信封校验失败（key_mismatch/challenge_invalid_or_used/crypto_failed/envelope_incomplete），见 §5.1:157-161
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

