location ^~ /zwt-meeting/assist/v1/ {
    proxy_pass http://127.0.0.1:19917;
    client_max_body_size 17m;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    access_log off;
}
location = /zwt-meeting { return 308 /zwt-meeting/$is_args$args; }
location = /zwt-meeting/api/v1/session/weitong { return 404; }
# Existing public media clients keep their account, room and WebRTC endpoints.
location = /zwt-meeting/api/v1/session { proxy_pass http://127.0.0.1:19894; }
location = /zwt-meeting/api/v1/session/exchange { proxy_pass http://127.0.0.1:19894; }
location = /zwt-meeting/api/v1/health { proxy_pass http://127.0.0.1:19894; }
location = /zwt-meeting/api/v1/rooms { proxy_pass http://127.0.0.1:19894; }
location ^~ /zwt-meeting/api/v1/rooms/ { proxy_pass http://127.0.0.1:19894; client_max_body_size 160k; }
location = /zwt-meeting/apipost.json {
    root /opt/weitong-meeting/current/www;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
location = /zwt-meeting/api/v1/auth/email/send {
    limit_req zone=weitong_mail_ip burst=3 nodelay;
    limit_req zone=weitong_mail_site burst=15 nodelay;
    limit_req_status 429;
    error_page 429 = @weitong_mail_busy;
    proxy_pass http://127.0.0.1:19896/api/v1/auth/email/send;
    access_log off;
}
location @weitong_mail_busy {
    default_type application/json;
    charset utf-8;
    return 429 '{"code":429,"msg":"发送过于频繁，请稍后重试"}';
}
# The supplied SMS provider is console. It must never return a console OTP to Internet clients.
location ^~ /zwt-meeting/api/v1/auth/sms/ {
    default_type application/json;
    charset utf-8;
    return 503 '{"code":503,"msg":"短信服务尚未开通，请使用邮箱验证码登录"}';
}
location ^~ /zwt-meeting/api/ {
    proxy_pass http://127.0.0.1:19896/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 32m;
    access_log off;
}
location ^~ /zwt-meeting/ws/ {
    proxy_pass http://127.0.0.1:19896/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    access_log off;
}
location = /zwt-meeting/assets/media-player.js { proxy_pass http://127.0.0.1:19896/assets/media-player.js; }
location ^~ /zwt-meeting/assets/ {
    root /opt/weitong-meeting/current/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ^~ /zwt-meeting/ {
    root /opt/weitong-meeting/current/www;
    index index.html;
    try_files $uri $uri/ /zwt-meeting/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
}
