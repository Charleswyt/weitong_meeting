<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>MP4 导出端到端探针</title>
<style>body{font:13px/1.6 ui-monospace,Consolas,monospace;background:#0b1220;color:#cbd5e1;padding:16px}pre{white-space:pre-wrap}
#bar{height:6px;background:#1e293b}#bar>i{display:block;height:100%;width:0;background:#38bdf8}</style>
</head>
<body><div id="bar"><i></i></div><pre id="out">booting…</pre>
<script type="module">
// 整条链的最后一环：源 webm → demux → 解码 → 画布 → 编 H.264 → 音频离线混 → 编 AAC → mux 成 MP4。
// 源直接用接收器上 dump 好的 out/source.webm（省掉重造），产出 dump 成 out/muxed.mp4。
import { demuxWebM } from './mini-webm-demuxer.js'
import { muxMP4 } from './mini-mp4-muxer.js'

const out = document.getElementById('out')
const bar = document.querySelector('#bar>i')
const F = (n, d = 1) => Number(n).toFixed(d)
const RESULT = { stage: 'boot', note: [] }
window.__probe = RESULT
const say = (s) => { out.textContent += '\n' + s }
const prog = (r) => { bar.style.width = (Math.max(0, Math.min(1, r)) * 100).toFixed(1) + '%' }
const hex = (u8, n = 16) => [...u8.slice(0, n)].map((b) => b.toString(16).padStart(2, '0')).join(' ')
// 让出主线程用 MessageChannel，不用 setTimeout —— 后台/隐藏页会把定时器压到 ~1 次/秒，
// 那样量出来的"音频编码耗时"全是假的（实测 940 个包报成 44.9 秒）。
const mc = new MessageChannel()
const yieldTask = () => new Promise((r) => { mc.port1.onmessage = () => r(); mc.port2.postMessage(0) })
const SINK = 'http://127.0.0.1:5199'
const postFile = (name, bytes) => fetch(SINK + '/file/' + name, { method: 'POST', headers: { 'content-type': 'application/octet-stream' }, body: bytes })
const report = () => {
  try { document.title = 'MP4 ' + RESULT.stage + ' ' + (RESULT.mux ? F(RESULT.mux.bytes / 1024) + 'KB' : '') + ' ' + (RESULT.avcC ? 'avcC' : '') + (RESULT.asc ? ' ASC' : '') } catch {}
  fetch(SINK + '/result/mp4', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify(RESULT) }).catch(() => {})
}

async function main() {
  try {
    RESULT.hidden = document.hidden
    say('1) 取源（接收器上的 out/source.webm）…')
    const srcBuf = await (await fetch(SINK + '/file/source.webm')).arrayBuffer()
    RESULT.sourceBytes = srcBuf.byteLength
    const d = demuxWebM(srcBuf)
    RESULT.demux = { ms: d.ms, tracks: [...d.tracks.values()].map((t) => ({ n: t.number, type: t.type, codecId: t.codecId, w: t.w, h: t.h, sr: t.sampleRate, ch: t.channels })) }
    for (const t of RESULT.demux.tracks) say(`   轨 ${t.n}: ${t.codecId} type=${t.type} ${t.w ? t.w + '×' + t.h : t.sr + 'Hz/' + t.ch + 'ch'}`)
    const vTrack = [...d.tracks.values()].find((t) => t.type === 1)
    const aTrack = [...d.tracks.values()].find((t) => t.type === 2)
    const vFrames = vTrack ? (d.frames.get(vTrack.number) || []) : []
    if (!vFrames.length) throw new Error('没抠出视频帧')

    // ── 视频：解码 → 画布 → 编 H.264（要 avcC） ──────────────────────
    say('2) 视频：解码 → 画布 → 编 H.264…')
    const VW = 640, VH = 360, VTS = 1e6, SR0 = 48000  // 视频时间基用微秒，避免取整误差
    const vc = document.createElement('canvas'); vc.width = VW; vc.height = VH
    const vg = vc.getContext('2d')
    let avcC = null, vNeg = null, decErr = null, decN = 0
    const vSamples = []
    const vDec = new VideoDecoder({
      output: (fr) => {
        vg.fillStyle = '#0b1220'; vg.fillRect(0, 0, VW, VH)
        const s = Math.min(VW / fr.displayWidth, VH / fr.displayHeight)
        const w = fr.displayWidth * s, h = fr.displayHeight * s
        try { vg.drawImage(fr, (VW - w) / 2, (VH - h) / 2, w, h) } catch (e) { RESULT.note.push('画帧失败 ' + e.name) }
        const nf = new VideoFrame(vc, { timestamp: fr.timestamp, duration: fr.duration || 66666 })
        // 关键帧节奏按**已解出的帧数**算，不要按 vSamples.length —— 后者是编码器输出侧，
        // 与喂入侧不同步，会退化成"几乎每帧都是关键帧"（第一版就这么写的，产物白大一截）。
        vEnc.encode(nf, { keyFrame: decN % 30 === 0 })
        decN++
        nf.close(); fr.close()
      },
      error: (e) => { decErr = String(e && e.message || e) },
    })
    const vEnc = new VideoEncoder({
      output: (ch, meta) => {
        if (!vNeg) vNeg = meta && meta.decoderConfig && meta.decoderConfig.codec
        if (meta && meta.decoderConfig && meta.decoderConfig.description && !avcC) {
          avcC = new Uint8Array(meta.decoderConfig.description)
        }
        const u = new Uint8Array(ch.byteLength); ch.copyTo(u)
        let dur = ch.duration || 0
        vSamples.push({ ts: ch.timestamp, durationTicks: dur, key: ch.type === 'key', data: u })
      },
      error: (e) => RESULT.note.push('视频编码错误 ' + (e && e.message)),
    })
    vEnc.configure({ codec: 'avc1.640028', width: VW, height: VH, bitrate: 900000, framerate: 15 })
    vDec.configure({ codec: 'vp09.00.10.08', codedWidth: vTrack.w, codedHeight: vTrack.h })
    const tV = performance.now()
    for (const f of vFrames) {
      vDec.decode(new EncodedVideoChunk({ type: f.key ? 'key' : 'delta', timestamp: Math.round(f.tsMs * 1000), data: f.data }))
      if (vDec.decodeQueueSize > 16) await yieldTask()
    }
    await vDec.flush()
    // 这份**测试源**被页面节流了（画面帧远少于 15fps），而音频是完整的。
    // 为了让验收件画音等长（否则你看到的是"画面几秒就停了"，会误判成缺陷），把最后一帧按同一时间基
    // 补到音频长度。**真机不会这样** —— 真机源是完整帧率，画面本来就铺满整条时间轴。
    // 目标时长取**源音频轨末块的时间戳**：别拿"包数 × 1024/48000"推，
    // 源是 Opus、包长约 60ms，按 AAC 的 21.3ms 推会算成三分之一（实测踩过：7.13s vs 实际 20.04s）。
    const aFrames = aTrack ? (d.frames.get(aTrack.number) || []) : []
    const audioDurSec = aFrames.length ? aFrames[aFrames.length - 1].tsMs / 1000 : 0
    const lastTs = vSamples.length ? vSamples[vSamples.length - 1].ts : 0
    const padTo = Math.round(audioDurSec * 1e6)
    let padded = 0
    for (let ts = lastTs + 66666; ts < padTo; ts += 66666) {
      const nf = new VideoFrame(vc, { timestamp: ts, duration: 66666 })
      vEnc.encode(nf, { keyFrame: false })
      nf.close(); padded++
    }
    await vEnc.flush()
    say(`   源画面只有 ${vFrames.length} 帧（被节流）⇒ 补 ${padded} 帧到与音频等长（${F(audioDurSec)}s）`)
    const vMs = performance.now() - tV
    // 时长缺失的样本用下一个时间戳补差；最后一个沿用前一个
    for (let i = 0; i < vSamples.length; i++) {
      if (!vSamples[i].durationTicks) {
        const nxt = vSamples[i + 1] ? vSamples[i + 1].ts : vSamples[i].ts + 66666
        vSamples[i].durationTicks = Math.max(1, nxt - vSamples[i].ts)
      }
    }
    RESULT.video = { decoded: vSamples.length, negotiated: vNeg, avcC: avcC ? avcC.length : 0, transcodeMs: vMs, keyframes: vSamples.filter((s) => s.key).length, paddedFrames: padded, audioDurSec: Number(audioDurSec.toFixed(2)) }
    say(`   编出 ${vSamples.length} 样本 · 协商 ${vNeg} · avcC ${avcC ? avcC.length + 'B [' + hex(avcC) + ']' : '**无**'} · ${F(vMs / 1000)}s${decErr ? ' · 解码ERR ' + decErr : ''}`)

    // ── 音频：离线解码 → 混 → 编 AAC（要 AudioSpecificConfig） ────────
    say('3) 音频：离线解码 → 混 → 编 AAC…')
    const ac = new AudioContext()
    let audioBuf = null
    try { audioBuf = await ac.decodeAudioData(srcBuf.slice(0)) } catch (e) { RESULT.note.push('源音频解码失败 ' + e.name) }
    await ac.close().catch(() => {})
    const SR = 48000
    const durSec = audioBuf ? audioBuf.duration : 0
    const off = new OfflineAudioContext(2, Math.max(1, Math.round(durSec * SR)), SR)
    if (audioBuf) { const s1 = off.createBufferSource(); s1.buffer = audioBuf; s1.connect(off.destination); s1.start(0) }
    // 第二路：晚 2 秒入会的合成音（验"按偏移对齐后求和"）
    const s2buf = off.createBuffer(1, Math.max(1, Math.round(Math.max(0, durSec - 2) * SR)), SR)
    const s2d = s2buf.getChannelData(0)
    for (let i = 0; i < s2d.length; i++) s2d[i] = 0.4 * Math.sin((2 * Math.PI * 660 * i) / SR)
    const s2 = off.createBufferSource(); s2.buffer = s2buf; s2.connect(off.destination); s2.start(2)
    const mixed = await off.startRendering()

    let asc = null, aNeg = null, aErr = null
    const aSamples = []
    const aEnc = new AudioEncoder({
      output: (ch, meta) => {
        if (!aNeg) aNeg = meta && meta.decoderConfig && meta.decoderConfig.codec
        if (meta && meta.decoderConfig && meta.decoderConfig.description && !asc) {
          asc = new Uint8Array(meta.decoderConfig.description)
        }
        const u = new Uint8Array(ch.byteLength); ch.copyTo(u)
        aSamples.push({ durationTicks: 1024, key: true, data: u })
      },
      error: (e) => { aErr = String(e && e.message || e) },
    })
    aEnc.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 128000 })
    const N = 960
    const chL = mixed.getChannelData(0), chR = mixed.numberOfChannels > 1 ? mixed.getChannelData(1) : chL
    const planar = new Float32Array(N * 2)
    const tA = performance.now()
    for (let p = 0; p < mixed.length; p += N) {
      const n = Math.min(N, mixed.length - p)
      planar.fill(0)
      planar.set(chL.subarray(p, p + n), 0)
      planar.set(chR.subarray(p, p + n), N)
      aEnc.encode(new AudioData({
        format: 'f32-planar', sampleRate: SR, numberOfFrames: N, numberOfChannels: 2,
        timestamp: Math.round((p / SR) * 1e6), data: planar.slice(0),
      }))
      if (aEnc.encodeQueueSize > 16) await yieldTask()
    }
    await aEnc.flush()
    RESULT.audio = { negotiated: aNeg, asc: asc ? asc.length : 0, ascHex: asc ? hex(asc) : null, samples: aSamples.length, ms: performance.now() - tA, error: aErr, mixDurationSec: Number(mixed.duration.toFixed(2)) }
    say(`   编出 ${aSamples.length} 样本 · 协商 ${aNeg} · ASC ${asc ? asc.length + 'B [' + hex(asc) + ']' : '**无**'} · ${F(RESULT.audio.ms / 1000)}s${aErr ? ' · ERR ' + aErr : ''}`)

    // ── mux 成 MP4 ────────────────────────────────────────────────────
    say('4) mux 成 MP4…')
    RESULT.avcC = avcC ? avcC.length : 0
    RESULT.asc = asc ? asc.length : 0
    if (!avcC) throw new Error('没有 avcC，封不了 MP4')
    const tM = performance.now()
    const m = muxMP4({
      video: { width: VW, height: VH, avcC, timescale: VTS, samples: vSamples.map((s) => ({ durationTicks: s.durationTicks, key: s.key, data: s.data })) },
      audio: asc ? { sampleRate: SR, channels: 2, asc, bitrate: 128000, samples: aSamples } : null,
    })
    RESULT.mux = { ms: performance.now() - tM, bytes: m.bytes.length, chunkCount: m.chunkCount, moovBytes: m.moovBytes, movieDurMs: m.movieDurMs, head: hex(m.bytes, 24) }
    say(`   ${F(RESULT.mux.ms)}ms · ${(m.bytes.length / 1048576).toFixed(2)} MB · chunk ${m.chunkCount} · moov ${m.moovBytes}B · 头 [${RESULT.mux.head}]`)
    await postFile('muxed.mp4', m.bytes).catch(() => RESULT.note.push('dump 失败'))
    say('   已 dump 到 out/muxed.mp4')

    // 顺手让 Chromium 自己解一遍这份 MP4 的音频 —— 这是唯一能在隐藏页里跑的自证
    say('5) 自证：让 Chromium 解这份 MP4 的音频…')
    try {
      const ac2 = new AudioContext()
      const back = await ac2.decodeAudioData(m.bytes.slice(0).buffer)
      let peak = 0
      for (let c = 0; c < back.numberOfChannels; c++) {
        const dd = back.getChannelData(c)
        for (let i = 0; i < dd.length; i += 7) peak = Math.max(peak, Math.abs(dd[i]))
      }
      RESULT.selfCheck = { ok: true, durationSec: Number(back.duration.toFixed(2)), sampleRate: back.sampleRate, channels: back.numberOfChannels, peak: Number(peak.toFixed(4)) }
      say(`   解出 ${RESULT.selfCheck.durationSec}s · ${back.sampleRate}Hz · ${back.numberOfChannels}ch · 峰值 ${RESULT.selfCheck.peak}`)
      await ac2.close().catch(() => {})
    } catch (e) {
      RESULT.selfCheck = { ok: false, error: e.name + ': ' + e.message }
      say('   解不开：' + RESULT.selfCheck.error)
    }
    RESULT.stage = 'done'
  } catch (e) {
    RESULT.stage = 'error'; RESULT.error = String(e && e.message || e); say('ERROR ' + RESULT.error)
  }
  say('DONE')
  report()
}
main()
</script>
</body>
</html>
