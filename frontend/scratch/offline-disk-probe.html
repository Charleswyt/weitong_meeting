<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>disk-probe</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 16px; background: #0f172a; color: #e2e8f0; }
  pre { white-space: pre-wrap; word-break: break-all; }
  button { margin-right: 8px; }
</style>
</head>
<body>
<h3>离线合成 · 落盘目标探针（任务 #6）</h3>
<p>要答的三问：① 边合成边写 OPFS 后，JS 堆还长不长（基线：987 秒那场 BufferTarget 峰值 683 MB）；
② <code>fastStart:'reserve'</code> 在可寻址流式写下是否仍是"moov 在前"的合法件；
③ 取消/失败后 OPFS 里有没有留垃圾。</p>
<p><button id="cancel">取消（验半截件）</button></p>
<pre id="out">准备中…</pre>
<script type="module">
/**
 * 跑法：node scratch/range-server.mjs(5200) + probe-receiver.mjs(5199) + pnpm dev(5176)，
 * 然后浏览器打开 /scratch/offline-disk-probe.html?sec=987
 * 读结果只走两条自建通道：document.title（list_pages 能读）+ POST /result/disk-compose
 * （evaluate_script 在本机恒返回 {}，take_snapshot 读不到 <pre>，别再试）。
 */
import { composeOffline } from '/src/utils/offlineCompose/composeOffline.ts'
import { splitContainers } from '/src/utils/offlineCompose/segmentSource.ts'
import { probeEngineCapabilities } from '/src/utils/offlineCompose/engine.ts'

const BASE = 'http://127.0.0.1:5200/'
const RECEIVER = 'http://127.0.0.1:5199'
const out = document.getElementById('out')
const R = { stages: {} }
function say(s) { out.textContent = s; document.title = s.split('\n').filter(Boolean).slice(-1)[0].slice(0, 120) }
let RUN = 'pending'
async function report(k, v) {
  R.stages[k] = v
  say(Object.entries(R.stages).map(([a, b]) => `${a}: ${JSON.stringify(b).slice(0, 300)}`).join('\n'))
  // 结果通道按**本次运行**分文件：同时开多个探针页时共用一个名字会互相覆盖（计划 §7 撞过的坑）
  try { await fetch(`${RECEIVER}/result/disk-${RUN}`, { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify(R) }) } catch { /* 接收器没起不影响产物 */ }
}
const mb = (n) => Math.round(n / 1048576 * 10) / 10
const heapNow = () => (performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null)

// 取消处理器**必须在任何 await 之前绑上**：上一版绑在能力探测之后，那点窗口里点取消等于没点
// （实测三次全 300 秒跑满）。绑定即留痕，标题能看出这次点击真落到了页面。
let cancelled = false
document.getElementById('cancel').onclick = () => {
  cancelled = true
  document.title = 'cancel-flag-set'
}

const q = new URLSearchParams(location.search)
const capSec = Number(q.get('sec') || 987)
RUN = `${Math.round(capSec)}s-${Date.now().toString(36)}`
const groups = (q.get('group') || '20260929182818/chenfang/59505895').split(',')

let manifest = null, group = null
for (const g of groups) {
  try {
    const res = await fetch(`${BASE}${encodeURI(g)}/manifest.json`)
    if (!res.ok) continue
    const json = await res.json()
    if (json?.streams?.length) { manifest = json; group = g; break }
  } catch { continue }
}
if (!manifest) { say('拿不到任何一组的 manifest（range-server 没起来？）'); throw new Error('no manifest') }

const streams = manifest.streams.filter((s) => s.segments?.length)
const lanes = []
const skipped = []
for (const st of streams) {
  const fileUrl = `${BASE}${encodeURI(`${group}/${st.fileName}`)}`
  let prefix = 0
  const slices = st.segments.map((seg, i) => {
    const s = { blobKey: `${st.fileName}#${i}`, seq: i, offsetSec: seg.offsetSeconds, durationSec: seg.durationSeconds, sizeBytes: seg.bytes }
    const start = prefix; prefix += seg.bytes
    return { ...s, start }
  })
  const byKey = new Map(slices.map((s) => [s.blobKey, s]))
  const fetched = { bytes: 0, calls: 0 }
  const containers = splitContainers(st.recordingId, slices.map(({ blobKey, seq, offsetSec, durationSec, sizeBytes }) => ({ blobKey, seq, offsetSec, durationSec, sizeBytes })))
  if (containers.containerCount !== 1) { skipped.push({ id: st.recordingId, containers: containers.containerCount }); continue }
  if (!st.hasVideo && !st.hasAudio) continue
  lanes.push({
    id: st.recordingId, label: `${st.ownerName}-${st.kind}`, hasVideo: !!st.hasVideo, hasAudio: !!st.hasAudio,
    kind: st.kind, containers: containers.containers,
    width: st.width ?? null, height: st.height ?? null, frameRate: st.frameRate ?? null,
    sampleRate: st.sampleRate ?? null, channelCount: st.channelCount ?? null, mime: st.mime || '',
    fetchSlice: async (blobKey) => {
      const s = byKey.get(blobKey)
      if (!s) return null
      const res = await fetch(fileUrl, { headers: { Range: `bytes=${s.start}-${s.start + s.sizeBytes - 1}` } })
      const buf = await res.arrayBuffer()
      fetched.bytes += buf.byteLength; fetched.calls++
      return buf
    },
    _fetched: fetched,
  })
}

// OPFS 起始态：残留几个、占了多少盘
async function opfsState() {
  const dir = await navigator.storage.getDirectory()
  const names = []
  for await (const [name, entry] of dir.entries()) if (entry.kind === 'file') names.push(name)
  const est = await navigator.storage.estimate()
  return { files: names.filter((n) => n.startsWith('compose-')), totalFiles: names.length, usageMB: mb(est.usage || 0), quotaMB: mb(est.quota || 0) }
}
await report('intake', { group, total: streams.length, usable: lanes.length, skipped, capSec, opfsBefore: await opfsState() })
if (!lanes.some((l) => l.hasVideo)) { say('这一组没有可合成的画面路'); throw new Error('no usable video lane') }

const caps = await probeEngineCapabilities(15)
await report('caps', caps)

const spec = {
  lanes: lanes.map((l) => ({
    id: l.id, label: l.label, hasVideo: l.hasVideo, hasAudio: l.hasAudio,
    kind: l.kind, containers: l.containers, fetchSlice: l.fetchSlice,
    width: l.width, height: l.height, frameRate: l.frameRate, sampleRate: l.sampleRate, channelCount: l.channelCount, mime: l.mime,
  })),
  mode: 'grid', cols: 3, focusId: null, fpsOut: 15, cellWidth: 480,
  durationSec: capSec, audioChunkSec: 15,
}

const heaps = []
const t0 = performance.now()
const timer = setInterval(() => heaps.push(heapNow()), 500)
let outcome = null
let threw = ''
try {
  outcome = await composeOffline(spec, {
    onProgress: () => {},
    cancel: () => { cancelled = true },
    isCancelled: () => cancelled,
  }, caps)
} catch (e) { threw = `${e?.name}: ${e?.message}` }
clearInterval(timer)
const wall = Math.round((performance.now() - t0) / 100) / 10
const peak = heaps.filter((h) => h != null).reduce((a, b) => Math.max(a, b), 0)

if (threw) { await report('threw', { threw, wallSec: wall, peakHeapMB: peak, opfsAfter: await opfsState() }); throw new Error(threw) }

const isFile = typeof File !== 'undefined' && outcome.blob instanceof File
await report('outcome', {
  kind: outcome.kind, engine: outcome.engine,
  coveredSec: Math.round(outcome.coveredSec * 10) / 10, durationSec: Math.round(outcome.durationSec * 10) / 10,
  wallSec: wall, speedup: Math.round((outcome.coveredSec / wall) * 10) / 10,
  blobMB: mb(outcome.blob?.size || 0),
  // 走到落盘那一路的硬证据：产物是 OPFS 里的 File（名字带 compose-），不是内存拼出来的 Blob
  diskPath: isFile && String(outcome.blob.name).startsWith('compose-'),
  blobName: outcome.blob?.name ?? null,
  failureCode: outcome.failureCode ?? null, reasons: outcome.reasons,
  droppedAudio: outcome.droppedAudioLanes.length, placeholders: outcome.placeholderLanes.length,
  unusable: outcome.unusableVideoLanes.length, anomalous: outcome.skippedAnomalousLanes.length,
  peakHeapMB: peak, heapSamples: heaps.filter((h) => h != null).length,
  bytesPulledMB: mb(lanes.reduce((s, l) => s + l._fetched.bytes, 0)),
})
await report('opfsAfter', await opfsState())

if (outcome.blob) {
  const name = `disk-${RUN}-${outcome.kind}.mp4`
  try { await fetch(`${RECEIVER}/file/${name}`, { method: 'POST', headers: { 'content-type': 'application/octet-stream' }, body: outcome.blob }) } catch { /* 产物没送到接收器不影响上面的读数 */ }
  await report('dumped', { name })
}
say('完成')
</script>
</body>
</html>
